services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  lecture-bot:
    build: .
    ports:
      - "3000:3000"
      - "5173:5173"
    env_file: .env
    environment:
      MONGODB_URL: mongodb://mongo:27017
      STUDY_PACK_DIR: /app/data/study-packs
    depends_on:
      - mongo
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
      - study-packs:/app/data/study-packs

volumes:
  mongo-data:
  study-packs:
